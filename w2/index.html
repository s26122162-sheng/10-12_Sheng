<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？隨機抽籤機</title>
  <style>
    /* 1. 全局樣式設定：活潑黃橘色漸層 */
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #FFB703, #FB8500);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* 2. 主卡片容器 */
    .card {
      background: #FFFFFF;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    /* 3. 標題樣式 */
    h1 {
      color: #D00000;
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    /* 4. 圖片顯示區域 */
    #image-box {
      margin: 15px 0;
      border-radius: 12px;
      overflow: hidden;
    }

    #food-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* 5. 按鈕樣式與動畫效果 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button, a {
      display: block;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      transition: transform 0.1s ease;
    }

    button:active, a:active {
      transform: scale(0.95);
    }

    /* 點我抽籤按鈕 */
    #draw-btn {
      background-color: #FFB703;
      color: #000;
    }

    /* 馬上出發按鈕 */
    #map-btn {
      background-color: #023047;
      color: #FFF;
    }

    /* 6. 生動彈跳動畫 (Bounce) */
    .bounce {
      animation: pop 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 隱藏元素 */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 大標題 -->
    <h1 id="title">今天吃什麼？🍴</h1>

    <!-- 食物照片區塊 -->
    <div id="image-box" class="hidden">
      <img id="food-img" src="" alt="Food Picture">
    </div>

    <!-- 功能按鈕區塊 -->
    <div class="button-group">
      <button id="draw-btn" onclick="startDraw()">點我抽籤 🎲</button>
      <a id="map-btn" class="hidden" href="#" target="_blank" rel="noopener noreferrer">馬上出發 🚗</a>
    </div>
  </div>

  <script>
    // 5 個餐廳選項與圖片網址
    const foods = [
      {
        name: "越南店 🍜",
        query: "越南料理",
        image: "https://picsum.photos/id/1080/600/400"
      },
      {
        name: "鴨肉飯 🦆",
        query: "鴨肉飯",
        image: "https://picsum.photos/id/225/600/400"
      },
      {
        name: "深水食堂 🍲",
        query: "深水食堂",
        image: "https://picsum.photos/id/292/600/400"
      },
      {
        name: "麥當勞 🍔",
        query: "麥當勞",
        image: "https://picsum.photos/id/1060/600/400"
      },
      {
        name: "鹹酥雞 🍗",
        query: "鹹酥雞",
        image: "https://picsum.photos/id/431/600/400"
      }
    ];

    // 抽籤邏輯與動畫觸發
    function startDraw() {
      const title = document.getElementById("title");
      const imageBox = document.getElementById("image-box");
      const foodImg = document.getElementById("food-img");
      const mapBtn = document.getElementById("map-btn");
      const drawBtn = document.getElementById("draw-btn");

      // 隨機抽取項目
      const randomIndex = Math.floor(Math.random() * foods.length);
      const selected = foods[randomIndex];

      // 更新文字與圖片內容
      title.innerText = "今天就吃：" + selected.name;
      foodImg.src = selected.image;
      mapBtn.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(selected.query);

      // 顯示圖片與導航按鈕
      imageBox.classList.remove("hidden");
      mapBtn.classList.remove("hidden");

      // 重置並觸發彈跳動畫
      title.classList.remove("bounce");
      imageBox.classList.remove("bounce");
     
      void title.offsetWidth; // 觸發 DOM 重繪

      title.classList.add("bounce");
      imageBox.classList.add("bounce");

      // 變更按鈕文字
      drawBtn.innerText = "再抽一次 🔄";
    }
  </script>
</body>
</html>
