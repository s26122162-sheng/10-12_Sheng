<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍照二選一 · 檸檬粉投票器</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 自訂風格：檸檬粉清新 -->
    <style>
        :root {
            --lemon: #fef9c3;      /* 淡黃檸檬 */
            --pink: #fbcfe8;       /* 粉紅 */
            --pink-deep: #f472b6;
            --pink-light: #fce7f3;
            --mint: #e6f7f0;
        }
        body {
            background: linear-gradient(145deg, #fff9f0 0%, #fef2f8 100%);
            font-family: 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(244, 114, 182, 0.3), 0 8px 24px -8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(251, 207, 232, 0.6);
            width: 100%;
            max-width: 500px;
            transition: all 0.2s;
        }
        .photo-box {
            background: white;
            border-radius: 1.8rem;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            position: relative;
            box-shadow: 0 4px 12px rgba(251, 113, 133, 0.15);
            border: 2px dashed var(--pink);
            transition: border 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .photo-box:hover {
            border-color: var(--pink-deep);
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.25);
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-box .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #f9a8d4;
            font-size: 3rem;
            background: #fffafc;
            gap: 0.5rem;
        }
        .photo-box .placeholder span {
            font-size: 0.9rem;
            color: #f472b6;
            font-weight: 500;
            background: #fff0f7;
            padding: 0.25rem 1rem;
            border-radius: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f9a8d4, #f472b6);
            color: white;
            font-weight: 600;
            border-radius: 9999px;
            padding: 0.75rem 1.5rem;
            transition: all 0.2s;
            box-shadow: 0 8px 20px -6px #f472b6;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            background: #ddd6fe;
            pointer-events: none;
        }
        .btn-outline {
            background: white;
            border: 2px solid #fbcfe8;
            color: #db2777;
            font-weight: 600;
            border-radius: 9999px;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-outline:hover {
            background: #fdf2f8;
            border-color: #f472b6;
        }
        .timer-badge {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 9999px;
            padding: 0.35rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #be185d;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 10px rgba(251, 207, 232, 0.6);
            border: 1px solid #fbcfe8;
        }
        .vote-bar {
            background: #fff0f7;
            border-radius: 9999px;
            height: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
        }
        .vote-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s ease;
            background: linear-gradient(90deg, #f9a8d4, #f472b6);
        }
        .vote-bar-fill.b {
            background: linear-gradient(90deg, #fcd34d, #fbbf24);
        }
        .hidden-admin {
            opacity: 0.3;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .hidden-admin:hover {
            opacity: 1;
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="card p-5 md:p-6">
        <!-- Header: 標題 + 隱藏管理員彩蛋 (右上角) -->
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i class="fas fa-lemon text-yellow-400 text-xl"></i>
                <h1 class="text-xl font-bold text-pink-600 tracking-tight">拍照二選一</h1>
            </div>
            <!-- 隱藏管理員：點擊可提前結束並開票 (僅在投票中時有效) -->
            <div id="adminEgg" class="hidden-admin text-xs text-pink-300" title="管理員彩蛋">🍋</div>
        </div>

        <!-- 題目輸入區 (建立投票時) -->
        <div id="createSection" class="space-y-4">
            <input type="text" id="pollTitle" placeholder="輸入投票題目 (例：午餐吃什麼？)" 
                   class="w-full px-4 py-3 rounded-2xl border border-pink-200 focus:border-pink-400 focus:ring-2 focus:ring-pink-200 outline-none bg-white/80 text-gray-700 placeholder-pink-300 text-sm" value="今天選哪個？">

            <!-- 兩張照片預覽與上傳 -->
            <div class="grid grid-cols-2 gap-3">
                <!-- A 選項 -->
                <div>
                    <div id="photoBoxA" class="photo-box" data-option="A">
                        <div class="placeholder">
                            <i class="fas fa-camera"></i>
                            <span>點我拍照 A</span>
                        </div>
                    </div>
                    <input type="file" id="fileInputA" accept="image/*" capture="environment" class="hidden">
                </div>
                <!-- B 選項 -->
                <div>
                    <div id="photoBoxB" class="photo-box" data-option="B">
                        <div class="placeholder">
                            <i class="fas fa-camera"></i>
                            <span>點我拍照 B</span>
                        </div>
                    </div>
                    <input type="file" id="fileInputB" accept="image/*" capture="environment" class="hidden">
                </div>
            </div>

            <!-- 截止時間設定 -->
            <div class="flex flex-col gap-2">
                <label class="text-xs font-semibold text-pink-500 flex items-center gap-1">
                    <i class="far fa-clock"></i> 截止時間 (精確到分鐘)
                </label>
                <input type="datetime-local" id="deadlineInput" 
                       class="w-full px-4 py-2.5 rounded-2xl border border-pink-200 focus:border-pink-400 outline-none bg-white/80 text-gray-600 text-sm">
            </div>

            <!-- 建立按鈕 -->
            <button id="createBtn" class="btn-primary w-full">
                <i class="fas fa-cloud-upload-alt"></i> 建立投票 · 產生分享連結
            </button>
            <p class="text-xs text-center text-pink-400 mt-1">上傳後自動壓縮為 800px，儲存至 Google Drive</p>
        </div>

        <!-- 投票區 (建立後或透過連結進入) -->
        <div id="voteSection" class="hidden space-y-5">
            <!-- 題目與倒數 -->
            <div class="text-center">
                <h2 id="displayTitle" class="text-xl font-bold text-gray-800 mb-1">投票題目</h2>
                <div id="timerDisplay" class="timer-badge">
                    <i class="fas fa-hourglass-half"></i> <span id="countdownText">載入中...</span>
                </div>
            </div>

            <!-- 圖片選項 (投票用) -->
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col items-center">
                    <div id="voteImgA" class="photo-box w-full cursor-pointer" data-vote="A">
                        <img id="imgA" src="" alt="選項A" class="hidden">
                        <div class="placeholder" id="placeholderA">
                            <i class="fas fa-image"></i>
                            <span>選項 A</span>
                        </div>
                    </div>
                    <button id="voteBtnA" class="btn-outline mt-2 w-full text-sm py-2">
                        <i class="fas fa-heart"></i> 投 A
                    </button>
                    <div class="w-full mt-1.5">
                        <div class="flex justify-between text-xs text-gray-500 mb-0.5">
                            <span>A 票數</span>
                            <span id="voteCountA">0</span>
                        </div>
                        <div class="vote-bar">
                            <div id="voteBarA" class="vote-bar-fill" style="width:0%"></div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div id="voteImgB" class="photo-box w-full cursor-pointer" data-vote="B">
                        <img id="imgB" src="" alt="選項B" class="hidden">
                        <div class="placeholder" id="placeholderB">
                            <i class="fas fa-image"></i>
                            <span>選項 B</span>
                        </div>
                    </div>
                    <button id="voteBtnB" class="btn-outline mt-2 w-full text-sm py-2">
                        <i class="fas fa-heart"></i> 投 B
                    </button>
                    <div class="w-full mt-1.5">
                        <div class="flex justify-between text-xs text-gray-500 mb-0.5">
                            <span>B 票數</span>
                            <span id="voteCountB">0</span>
                        </div>
                        <div class="vote-bar">
                            <div id="voteBarB" class="vote-bar-fill b" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 開票結果 (截止後顯示) -->
            <div id="resultSection" class="hidden text-center bg-pink-50 rounded-2xl p-4 border border-pink-200">
                <p class="text-sm font-semibold text-pink-600 mb-1"><i class="fas fa-trophy"></i> 開票結果</p>
                <p id="resultText" class="text-lg font-bold text-gray-700">A 勝出 🎉</p>
            </div>

            <!-- 分享連結 -->
            <div class="bg-white/60 rounded-2xl p-3 flex items-center gap-2 border border-pink-100">
                <i class="fas fa-link text-pink-400 text-sm"></i>
                <input id="shareUrlInput" type="text" readonly 
                       class="flex-1 bg-transparent text-xs text-gray-600 outline-none truncate" value="">
                <button id="copyBtn" class="text-pink-500 text-sm hover:text-pink-700">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- 底部提示 -->
        <p class="text-center text-[0.65rem] text-pink-300 mt-4">🍋 檸檬粉 · 拍照二選一投票器</p>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast"></div>

    <script>
        (function() {
            // ==================== 設定 ====================
            const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx0hqb4pBHibNJnih2Rv3cDe-ojbuC76cD42LqysEum7BIRQV6wZUKr4XPC754Z3s_I/exec';

            // ==================== 狀態管理 ====================
            const state = {
                pollId: null,           // 當前投票 ID
                pollData: null,         // 投票資料 (從 GAS 取得)
                selectedFileA: null,    // 壓縮後的 A 圖片 Blob
                selectedFileB: null,    // 壓縮後的 B 圖片 Blob
                previewUrlA: null,
                previewUrlB: null,
                timerInterval: null,
                isCreator: false,       // 是否為建立者 (用於顯示隱藏彩蛋)
                voted: false,           // 是否已投票 (本地標記)
            };

            // ==================== DOM 元素 ====================
            const createSection = document.getElementById('createSection');
            const voteSection = document.getElementById('voteSection');
            const pollTitleInput = document.getElementById('pollTitle');
            const deadlineInput = document.getElementById('deadlineInput');
            const createBtn = document.getElementById('createBtn');
            const photoBoxA = document.getElementById('photoBoxA');
            const photoBoxB = document.getElementById('photoBoxB');
            const fileInputA = document.getElementById('fileInputA');
            const fileInputB = document.getElementById('fileInputB');
            const adminEgg = document.getElementById('adminEgg');

            const displayTitle = document.getElementById('displayTitle');
            const countdownText = document.getElementById('countdownText');
            const timerDisplay = document.getElementById('timerDisplay');
            const imgA = document.getElementById('imgA');
            const imgB = document.getElementById('imgB');
            const placeholderA = document.getElementById('placeholderA');
            const placeholderB = document.getElementById('placeholderB');
            const voteBtnA = document.getElementById('voteBtnA');
            const voteBtnB = document.getElementById('voteBtnB');
            const voteCountA = document.getElementById('voteCountA');
            const voteCountB = document.getElementById('voteCountB');
            const voteBarA = document.getElementById('voteBarA');
            const voteBarB = document.getElementById('voteBarB');
            const resultSection = document.getElementById('resultSection');
            const resultText = document.getElementById('resultText');
            const shareUrlInput = document.getElementById('shareUrlInput');
            const copyBtn = document.getElementById('copyBtn');

            // ==================== 工具函數 ====================
            function showToast(msg, duration = 2500) {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            // 取得網址參數
            function getPollIdFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('poll');
            }

            // 設定分享連結
            function setShareUrl(pollId) {
                const baseUrl = window.location.origin + window.location.pathname;
                const url = `${baseUrl}?poll=${pollId}`;
                shareUrlInput.value = url;
                return url;
            }

            // 格式化倒數時間
            function formatCountdown(ms) {
                if (ms <= 0) return '已截止';
                const totalSec = Math.floor(ms / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const mins = Math.floor((totalSec % 3600) / 60);
                const secs = totalSec % 60;
                if (days > 0) return `${days}天 ${hours}時 ${mins}分`;
                if (hours > 0) return `${hours}時 ${mins}分 ${secs}秒`;
                return `${mins}分 ${secs}秒`;
            }

            // 圖片壓縮 (Canvas 縮放至寬度或高度最大 800px，裁切為 1:1 正方形)
            function compressImage(file, maxSize = 800) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const size = Math.min(img.width, img.height, maxSize);
                            // 裁切為正方形 (取中心)
                            const sx = (img.width - Math.min(img.width, img.height)) / 2;
                            const sy = (img.height - Math.min(img.width, img.height)) / 2;
                            const sw = Math.min(img.width, img.height);
                            const sh = sw;

                            canvas.width = size;
                            canvas.height = size;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);

                            canvas.toBlob((blob) => {
                                if (blob) resolve(blob);
                                else reject(new Error('壓縮失敗'));
                            }, 'image/jpeg', 0.82);
                        };
                        img.onerror = () => reject(new Error('圖片載入失敗'));
                        img.src = e.target.result;
                    };
                    reader.onerror = () => reject(new Error('讀取檔案失敗'));
                    reader.readAsDataURL(file);
                });
            }

            // 上傳圖片到 GAS (回傳公開網址)
            async function uploadImage(blob, fileName) {
                const formData = new FormData();
                formData.append('image', blob, fileName);
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '上傳失敗');
                return data.url; // 回傳圖片網址
            }

            // 建立投票 (呼叫 GAS)
            async function createPoll(title, deadlineISO, urlA, urlB) {
                const payload = {
                    action: 'create',
                    title: title,
                    deadline: deadlineISO,
                    imageA: urlA,
                    imageB: urlB,
                };
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '建立失敗');
                return data; // { success, pollId, ... }
            }

            // 取得投票資料 (呼叫 GAS)
            async function fetchPollData(pollId) {
                const res = await fetch(`${GAS_API_URL}?poll=${pollId}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '載入失敗');
                return data;
            }

            // 投票 (呼叫 GAS)
            async function submitVote(pollId, option) {
                const payload = {
                    action: 'vote',
                    pollId: pollId,
                    option: option,
                };
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '投票失敗');
                return data;
            }

            // 提前結束 (管理員)
            async function endPollEarly(pollId) {
                const payload = { action: 'end', pollId: pollId };
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '操作失敗');
                return data;
            }

            // 更新 UI 為投票狀態 (載入資料後)
            function renderPollUI(data) {
                state.pollData = data;
                displayTitle.textContent = data.title || '投票題目';

                // 設定圖片
                if (data.imageA) {
                    imgA.src = data.imageA;
                    imgA.classList.remove('hidden');
                    placeholderA.classList.add('hidden');
                }
                if (data.imageB) {
                    imgB.src = data.imageB;
                    imgB.classList.remove('hidden');
                    placeholderB.classList.add('hidden');
                }

                updateVoteCounts(data.votesA || 0, data.votesB || 0);

                // 截止時間處理
                const deadline = new Date(data.deadline);
                const now = new Date();
                const isEnded = data.status === 'ended' || now >= deadline;

                // 啟動倒數
                if (state.timerInterval) clearInterval(state.timerInterval);
                const updateCountdown = () => {
                    const nowTime = new Date();
                    const diff = deadline - nowTime;
                    if (diff <= 0 || data.status === 'ended') {
                        countdownText.textContent = '已截止';
                        timerDisplay.classList.add('bg-pink-100');
                        // 顯示結果
                        showResult(data);
                        // 禁用投票按鈕
                        voteBtnA.disabled = true;
                        voteBtnB.disabled = true;
                        if (state.timerInterval) clearInterval(state.timerInterval);
                    } else {
                        countdownText.textContent = formatCountdown(diff);
                    }
                };
                updateCountdown();
                if (!isEnded) {
                    state.timerInterval = setInterval(updateCountdown, 1000);
                } else {
                    showResult(data);
                    voteBtnA.disabled = true;
                    voteBtnB.disabled = true;
                }

                // 顯示分享連結
                setShareUrl(data.pollId);

                // 管理員彩蛋顯示條件：若是建立者 (透過建立流程) 或網址有特殊參數(這裡簡化為建立者)
                // 在建立時會設定 state.isCreator = true
                if (state.isCreator) {
                    adminEgg.style.opacity = '0.6';
                    adminEgg.title = '點擊提前結束並開票';
                }
            }

            function showResult(data) {
                const votesA = data.votesA || 0;
                const votesB = data.votesB || 0;
                let winner = '';
                if (votesA > votesB) winner = 'A 勝出 🎉';
                else if (votesB > votesA) winner = 'B 勝出 🎉';
                else winner = '平手 🤝';
                resultText.textContent = winner;
                resultSection.classList.remove('hidden');
            }

            function updateVoteCounts(votesA, votesB) {
                voteCountA.textContent = votesA;
                voteCountB.textContent = votesB;
                const total = votesA + votesB;
                const percentA = total > 0 ? (votesA / total) * 100 : 0;
                const percentB = total > 0 ? (votesB / total) * 100 : 0;
                voteBarA.style.width = percentA + '%';
                voteBarB.style.width = percentB + '%';
            }

            // 重置為建立表單狀態
            function resetToCreate() {
                createSection.classList.remove('hidden');
                voteSection.classList.add('hidden');
                adminEgg.style.opacity = '0.3';
                adminEgg.title = '管理員彩蛋';
                state.pollId = null;
                state.pollData = null;
                state.isCreator = false;
                state.voted = false;
                if (state.timerInterval) clearInterval(state.timerInterval);
            }

            // ==================== 事件綁定 ====================

            // 點擊拍照 (A / B)
            photoBoxA.addEventListener('click', () => fileInputA.click());
            photoBoxB.addEventListener('click', () => fileInputB.click());

            // 檔案選擇後壓縮預覽
            fileInputA.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    createBtn.disabled = true;
                    createBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> 壓縮中...';
                    const blob = await compressImage(file);
                    state.selectedFileA = blob;
                    if (state.previewUrlA) URL.revokeObjectURL(state.previewUrlA);
                    const url = URL.createObjectURL(blob);
                    state.previewUrlA = url;
                    // 更新預覽
                    photoBoxA.innerHTML = `<img src="${url}" alt="選項A" class="w-full h-full object-cover">`;
                    showToast('選項 A 已就緒');
                } catch (err) {
                    showToast('圖片處理失敗：' + err.message);
                } finally {
                    createBtn.disabled = false;
                    createBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 建立投票 · 產生分享連結';
                    fileInputA.value = '';
                }
            });

            fileInputB.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    createBtn.disabled = true;
                    createBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> 壓縮中...';
                    const blob = await compressImage(file);
                    state.selectedFileB = blob;
                    if (state.previewUrlB) URL.revokeObjectURL(state.previewUrlB);
                    const url = URL.createObjectURL(blob);
                    state.previewUrlB = url;
                    photoBoxB.innerHTML = `<img src="${url}" alt="選項B" class="w-full h-full object-cover">`;
                    showToast('選項 B 已就緒');
                } catch (err) {
                    showToast('圖片處理失敗：' + err.message);
                } finally {
                    createBtn.disabled = false;
                    createBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 建立投票 · 產生分享連結';
                    fileInputB.value = '';
                }
            });

            // 建立投票按鈕
            createBtn.addEventListener('click', async () => {
                const title = pollTitleInput.value.trim();
                const deadlineVal = deadlineInput.value;
                if (!title) { showToast('請輸入投票題目'); return; }
                if (!state.selectedFileA || !state.selectedFileB) { showToast('請上傳兩張照片'); return; }
                if (!deadlineVal) { showToast('請設定截止時間'); return; }

                // 轉換 deadline 為 ISO 字串
                const deadlineDate = new Date(deadlineVal);
                if (isNaN(deadlineDate.getTime()) || deadlineDate <= new Date()) {
                    showToast('截止時間必須晚於現在');
                    return;
                }
                const deadlineISO = deadlineDate.toISOString();

                createBtn.disabled = true;
                createBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> 上傳圖片中...';

                try {
                    // 1. 上傳兩張圖片
                    const [urlA, urlB] = await Promise.all([
                        uploadImage(state.selectedFileA, 'optionA.jpg'),
                        uploadImage(state.selectedFileB, 'optionB.jpg'),
                    ]);

                    createBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> 建立投票...';
                    // 2. 建立投票
                    const result = await createPoll(title, deadlineISO, urlA, urlB);

                    state.isCreator = true;
                    state.pollId = result.pollId;

                    // 3. 載入投票資料並顯示
                    const pollData = await fetchPollData(result.pollId);
                    createSection.classList.add('hidden');
                    voteSection.classList.remove('hidden');
                    renderPollUI(pollData);

                    // 更新網址 (不重新載入)
                    const newUrl = setShareUrl(result.pollId);
                    window.history.pushState({ pollId: result.pollId }, '', newUrl);

                    showToast('投票建立成功！分享連結已產生');
                } catch (err) {
                    showToast('建立失敗：' + err.message);
                } finally {
                    createBtn.disabled = false;
                    createBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 建立投票 · 產生分享連結';
                }
            });

            // 投票按鈕 (A / B)
            async function handleVote(option) {
                if (!state.pollId || !state.pollData) return;
                if (state.voted) { showToast('你已經投過票囉！'); return; }
                if (state.pollData.status === 'ended') { showToast('投票已截止'); return; }
                const deadline = new Date(state.pollData.deadline);
                if (new Date() >= deadline) { showToast('投票已截止'); return; }

                voteBtnA.disabled = true;
                voteBtnB.disabled = true;
                try {
                    await submitVote(state.pollId, option);
                    state.voted = true;
                    showToast(`已投給 ${option}！`);
                    // 重新取得資料更新票數
                    const updated = await fetchPollData(state.pollId);
                    renderPollUI(updated);
                } catch (err) {
                    showToast('投票失敗：' + err.message);
                    voteBtnA.disabled = false;
                    voteBtnB.disabled = false;
                }
            }

            voteBtnA.addEventListener('click', () => handleVote('A'));
            voteBtnB.addEventListener('click', () => handleVote('B'));

            // 點擊圖片也可以投票
            document.getElementById('voteImgA').addEventListener('click', () => handleVote('A'));
            document.getElementById('voteImgB').addEventListener('click', () => handleVote('B'));

            // 複製分享連結
            copyBtn.addEventListener('click', () => {
                if (!shareUrlInput.value) return;
                navigator.clipboard.writeText(shareUrlInput.value).then(() => {
                    showToast('連結已複製！');
                }).catch(() => {
                    showToast('複製失敗，請手動選取');
                });
            });

            // 隱藏管理員彩蛋：點擊提前結束
            adminEgg.addEventListener('click', async () => {
                if (!state.pollId || !state.pollData) return;
                if (state.pollData.status === 'ended') { showToast('投票已經結束'); return; }
                if (!confirm('確定要提前結束投票並開票嗎？')) return;
                try {
                    await endPollEarly(state.pollId);
                    showToast('已提前結束，開票中...');
                    const updated = await fetchPollData(state.pollId);
                    renderPollUI(updated);
                } catch (err) {
                    showToast('操作失敗：' + err.message);
                }
            });

            // ==================== 初始化 ====================
            async function init() {
                // 設定預設截止時間為現在 + 1 小時
                const now = new Date();
                now.setMinutes(now.getMinutes() + 60);
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                deadlineInput.value = `${year}-${month}-${day}T${hours}:${mins}`;

                // 檢查網址是否有 poll 參數
                const pollId = getPollIdFromUrl();
                if (pollId) {
                    state.pollId = pollId;
                    try {
                        const data = await fetchPollData(pollId);
                        createSection.classList.add('hidden');
                        voteSection.classList.remove('hidden');
                        renderPollUI(data);
                        // 從連結進入的用戶不是建立者，隱藏彩蛋
                        adminEgg.style.opacity = '0.2';
                        adminEgg.title = '僅管理員可用';
                        state.isCreator = false;
                    } catch (err) {
                        showToast('載入投票失敗：' + err.message);
                        resetToCreate();
                    }
                } else {
                    resetToCreate();
                }
            }

            init();
        })();
    </script>
</body>
</html>
